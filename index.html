<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>GSIS 웹바둑판</title>
  <style>
    /* 기존 스타일 유지 */
    body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; background: #f0f0f0; margin: 20px; }
    #board-container { position: relative; margin-bottom: 10px; }
    canvas { border: 2px solid #333; box-shadow: 3px 3px 10px rgba(0,0,0,0.3); background-color: #e3a857; cursor: pointer; }
    .controls { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; max-width: 600px; margin-bottom: 10px; }
    button, label.btn-label { padding: 8px 12px; font-size: 14px; cursor: pointer; background: #fff; border: 1px solid #ccc; border-radius: 4px; }
    button:hover, label.btn-label:hover { background: #eee; }
    #file-input { display: none; }
    #status { margin-top: 5px; font-weight: bold; }
  </style>
</head>
<body>

  <div id="board-container">
    <canvas id="board" width="600" height="600"></canvas>
  </div>

  <div class="controls">
    <!-- 위치 변경: 주소 복사 버튼을 캡쳐 버튼 앞으로 배치 -->
    <button onclick="copyURL()">주소 복사</button>
    <button onclick="captureBoard()">캡쳐</button>
    
    <button onclick="convertToScene()">장면도 변환</button>
    
    <!-- SGF 불러오기 -->
    <label class="btn-label" for="file-input">SGF 불러오기</label>
    <input type="file" id="file-input" accept=".sgf" onchange="loadSGF(event)">
  </div>

  <div id="status">대국 시작</div>

<script>
  // SGF 파일 불러오기 기능 수정본
  function loadSGF(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      const content = e.target.result;
      parseSGF(content);
    };
    reader.readAsText(file);
    
    // 동일한 파일 재선택 가능하도록 초기화
    event.target.value = '';
  }

  function parseSGF(sgfText) {
    try {
      // B[...] 또는 W[...] 형태의 수순 추출
      const moveRegex = /;([BW])\[([a-s]{2})?\]/gi;
      let match;
      const newHistory = [];

      while ((match = moveRegex.exec(sgfText)) !== null) {
        const color = match[1].toUpperCase();
        const posStr = match[2];

        // 손뼉(pass)이거나 좌표가 없는 경우 건너뜀
        if (!posStr || posStr.length < 2) continue;

        // SGF 좌표 (a-s)를 바둑판 인덱스 (0-18)로 변환
        const x = posStr.charCodeAt(0) - 97;
        const y = posStr.charCodeAt(1) - 97;

        if (x >= 0 && x < 19 && y >= 0 && y < 19) {
          newHistory.push({ x, y, color: color === 'B' ? 1 : 2 });
        }
      }

      if (newHistory.length === 0) {
        alert('SGF 파일에서 수순을 찾을 수 없거나 형식이 올바르지 않습니다.');
        return;
      }

      // 기보 초기화 및 적용
      fullHistory = newHistory;
      currentMoveIndex = fullHistory.length;
      
      updateStatus();
      drawBoard();
      alert(`SGF 파일을 성공적으로 불러왔습니다. (총 ${fullHistory.length}수)`);
    } catch (err) {
      alert('SGF 파일을 읽는 중 오류가 발생했습니다.');
      console.error(err);
    }
  }

  function copyURL() {
    navigator.clipboard.writeText(window.location.href).then(() => {
      alert('현재 주소가 클립보드에 복사되었습니다.');
    });
  }

  function captureBoard() {
    const canvas = document.getElementById('board');
    const image = canvas.toDataURL('image/png');
    const link = document.createElement('a');
    link.href = image;
    link.download = 'baduk_board.png';
    link.click();
  }
</script>
</body>
</html>
