<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>GSIS 웹바둑판</title>
  
  <meta property="og:title" content="GSIS 웹바둑판">
  <meta property="og:description" content="바둑판 기보 공유">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gifshot/0.3.2/gifshot.min.js"></script>
  <style>
    * { box-sizing: border-box; }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 8px;
      background-color: #f4f4f9;
      font-family: 'Malgun Gothic', 'Pretendard', sans-serif;
    }

    .main-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 580px;
    }

    .status-panel {
      width: 100%;
      margin-bottom: 8px;
      padding: 6px 10px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      display: flex;
      gap: 8px;
      align-items: center;
      font-size: 0.82rem;
      flex-wrap: wrap;
      justify-content: space-around;
    }

    .stat-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .turn-indicator {
      font-weight: bold;
      color: #333;
    }

    .toggle-label {
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      user-select: none;
      font-weight: bold;
      color: #2b6cb0;
    }

    .toggle-label input {
      width: 14px;
      height: 14px;
      cursor: pointer;
    }

    .board-outer {
      position: relative;
      background-color: #DCB35C;
      padding: 8px;
      border-radius: 6px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      border: 2px solid #b38f46;
      width: 100%;
      max-width: 560px;
      aspect-ratio: 1 / 1;
      display: flex;
      justify-content: center;
      align-items: center;
      touch-action: manipulation;
    }

    canvas {
      display: block;
      cursor: pointer;
      width: 100% !important;
      height: 100% !important;
    }

    .controls-container {
      margin-top: 8px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .nav-controls {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 4px;
      width: 100%;
    }

    .action-controls {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
      width: 100%;
    }

    button {
      padding: 8px 2px;
      font-size: 0.75rem;
      border: none;
      border-radius: 5px;
      color: white;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: bold;
      width: 100%;
      text-align: center;
      white-space: nowrap;
    }

    .btn-nav { background-color: #4a5568; }
    .btn-nav:hover { background-color: #2d3748; }

    .btn-scene { background-color: #d69e2e; }
    .btn-scene:hover { background-color: #b7791f; }

    .btn-gif { background-color: #dd6b20; }
    .btn-gif:hover { background-color: #c05621; }

    .btn-share { background-color: #805ad5; }
    .btn-share:hover { background-color: #6b46c1; }

    .btn-capture { background-color: #3182ce; }
    .btn-capture:hover { background-color: #2b6cb0; }

    .btn-sgf { background-color: #38a169; }
    .btn-sgf:hover { background-color: #2f855a; }
  </style>
</head>
<body>

  <div class="main-container">
    <div class="status-panel">
      <div class="stat-item turn-indicator" id="turnStatus">현재: ⚫ 흑 (0수)</div>
      <div class="stat-item">
        <span>사석:</span>
        <span id="deadBlackStones">⚫ 0</span> / 
        <span id="deadWhiteStones">⚪ 0</span>
      </div>
      <label class="toggle-label">
        <input type="checkbox" id="toggleMoveNumbers" onchange="drawBoard()">
        수순
      </label>
    </div>

    <div class="board-outer">
      <canvas id="board" width="560" height="560"></canvas>
    </div>

    <div class="controls-container">
      <div class="nav-controls">
        <button class="btn-nav" onclick="goToMove(0)">│< 처음</button>
        <button class="btn-nav" onclick="moveStep(-5)">◀◀ 5수</button>
        <button class="btn-nav" onclick="moveStep(-1)">◀ 1수</button>
        <button class="btn-nav" onclick="moveStep(1)">1수 ▶</button>
        <button class="btn-nav" onclick="moveStep(5)">5수 ▶▶</button>
        <button class="btn-nav" onclick="goToMove(fullHistory.length)">끝 >│</button>
      </div>

      <div class="action-controls">
        <button class="btn-scene" onclick="convertToScene()">📷 장면도</button>
        <button class="btn-gif" id="gifBtn" onclick="createGifAnimation()">🎬 GIF</button>
        <button class="btn-share" onclick="copyShareUrl()">🔗 주소복사</button>
        <button class="btn-capture" onclick="captureBoard()">🖼️ 캡쳐</button>
        <button class="btn-sgf" onclick="exportSGF()">📁 SGF</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('board');
    const ctx = canvas.getContext('2d');
    const turnStatus = document.getElementById('turnStatus');
    const toggleMoveNumbers = document.getElementById('toggleMoveNumbers');
    const deadBlackStonesEl = document.getElementById('deadBlackStones');
    const deadWhiteStonesEl = document.getElementById('deadWhiteStones');
    const gifBtn = document.getElementById('gifBtn');

    const BOARD_SIZE = 19;
    const PADDING = 18;
    const CELL_SIZE = (canvas.width - PADDING * 2) / (BOARD_SIZE - 1);

    // 전체 수순 데이터 ({x, y, color, moveNumber})
    let fullMoves = [];
    let currentMoveIndex = 0;

    let baseBoardState = Array.from({ length: BOARD_SIZE }, () => Array(BOARD_SIZE).fill(0));
    let baseDeadBlack = 0;
    let baseDeadWhite = 0;

    const starPoints = [3, 9, 15];
    const sgfCoords = "abcdefghijklmnopqrstuvwxyz";

    // URL 안전 인코딩/디코딩
    function encodeMoves(moves) {
      const bytes = new Uint8Array(moves.length);
      for (let i = 0; i < moves.length; i++) {
        bytes[i] = (moves[i].x * 19) + moves[i].y;
      }
      let binary = '';
      for (let i = 0; i < bytes.length; i++) {
        binary += String.fromCharCode(bytes[i]);
      }
      return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    function decodeMoves(str) {
      try {
        let base64 = str.replace(/-/g, '+').replace(/_/g, '/');
        while (base64.length % 4) base64 += '=';
        const binary = atob(base64);
        const moves = [];
        for (let i = 0; i < binary.length; i++) {
          const code = binary.charCodeAt(i);
          const x = Math.floor(code / 19);
          const y = code % 19;
          moves.push({ x, y });
        }
        return moves;
      } catch (e) {
        return [];
      }
    }

    function getNeighbors(x, y) {
      const res = [];
      if (x > 0) res.push({x: x - 1, y: y});
      if (x < BOARD_SIZE - 1) res.push({x: x + 1, y: y});
      if (y > 0) res.push({x: x, y: y - 1});
      if (y < BOARD_SIZE - 1) res.push({x: x, y: y + 1});
      return res;
    }

    function getConnectedGroup(grid, startX, startY) {
      const color = grid[startX][startY];
      if (color === 0) return { group: [], liberties: 0 };

      const group = [];
      const visited = Array.from({ length: BOARD_SIZE }, () => Array(BOARD_SIZE).fill(false));
      const libertiesSet = new Set();
      const queue = [{x: startX, y: startY}];
      visited[startX][startY] = true;

      while (queue.length > 0) {
        const curr = queue.shift();
        group.push(curr);

        const neighbors = getNeighbors(curr.x, curr.y);
        for (let i = 0; i < neighbors.length; i++) {
          const n = neighbors[i];
          const nColor = grid[n.x][n.y];

          if (nColor === 0) {
            libertiesSet.add(`${n.x}_${n.y}`);
          } else if (nColor === color && !visited[n.x][n.y]) {
            visited[n.x][n.y] = true;
            queue.push(n);
          }
        }
      }

      return { group, liberties: libertiesSet.size };
    }

    // 지정한 수순(limit)까지 계산하여 판 상태 반환
    function computeStateAt(limit) {
      let board = baseBoardState.map(row => [...row]);
      let deadBlack = baseDeadBlack;
      let deadWhite = baseDeadWhite;
      let stoneMap = Array.from({ length: BOARD_SIZE }, () => Array(BOARD_SIZE).fill(null));

      // 기본 판에 돌이 배치되어 있다면 설정
      for (let x = 0; x < BOARD_SIZE; x++) {
        for (let y = 0; y < BOARD_SIZE; y++) {
          if (baseBoardState[x][y] !== 0) {
            stoneMap[x][y] = { moveNumber: 0, color: baseBoardState[x][y] };
          }
        }
      }

      for (let i = 0; i < limit && i < fullMoves.length; i++) {
        const m = fullMoves[i];
        const turn = m.color;
        const opponent = turn === 1 ? 2 : 1;

        board[m.x][m.y] = turn;
        stoneMap[m.x][m.y] = { moveNumber: m.moveNumber, color: turn };

        let captured = [];
        getNeighbors(m.x, m.y).forEach(n => {
          if (board[n.x][n.y] === opponent) {
            const { group, liberties } = getConnectedGroup(board, n.x, n.y);
            if (liberties === 0) captured = captured.concat(group);
          }
        });

        captured.forEach(pt => {
          board[pt.x][pt.y] = 0;
          stoneMap[pt.x][pt.y] = null;
        });

        if (turn === 1) deadWhite += captured.length;
        else deadBlack += captured.length;
      }

      return { board, deadBlack, deadWhite, stoneMap };
    }

    function drawBoard() {
      const state = computeStateAt(currentMoveIndex);

      deadBlackStonesEl.innerText = `⚫ ${state.deadBlack}`;
      deadWhiteStonesEl.innerText = `⚪ ${state.deadWhite}`;

      ctx.fillStyle = '#DCB35C';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = '#222';
      ctx.lineWidth = 1;
      for (let i = 0; i < BOARD_SIZE; i++) {
        ctx.beginPath();
        ctx.moveTo(PADDING + i * CELL_SIZE, PADDING);
        ctx.lineTo(PADDING + i * CELL_SIZE, canvas.height - PADDING);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(PADDING, PADDING + i * CELL_SIZE);
        ctx.lineTo(canvas.width - PADDING, PADDING + i * CELL_SIZE);
        ctx.stroke();
      }

      starPoints.forEach(x => {
        starPoints.forEach(y => {
          ctx.beginPath();
          ctx.arc(PADDING + x * CELL_SIZE, PADDING + y * CELL_SIZE, 3.5, 0, Math.PI * 2);
          ctx.fillStyle = '#111';
          ctx.fill();
        });
      });

      for (let x = 0; x < BOARD_SIZE; x++) {
        for (let y = 0; y < BOARD_SIZE; y++) {
          if (state.board[x][y] !== 0) {
            drawStone(x, y, state.board[x][y], state.stoneMap[x][y]);
          }
        }
      }
    }

    function drawStone(x, y, color, stoneData) {
      const cx = PADDING + x * CELL_SIZE;
      const cy = PADDING + y * CELL_SIZE;
      const radius = CELL_SIZE * 0.46;

      ctx.save();
      ctx.shadowColor = 'rgba(0, 0, 0, 0.4)';
      ctx.shadowBlur = radius * 0.3;
      ctx.shadowOffsetX = radius * 0.15;
      ctx.shadowOffsetY = radius * 0.18;

      ctx.beginPath();
      ctx.arc(cx, cy, radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      if (color === 1) {
        const gradient = ctx.createRadialGradient(
          cx - radius * 0.3, cy - radius * 0.3, radius * 0.05,
          cx, cy, radius
        );
        gradient.addColorStop(0, '#666666');
        gradient.addColorStop(0.3, '#222222');
        gradient.addColorStop(0.85, '#0a0a0a');
        gradient.addColorStop(1, '#000000');

        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.fillStyle = gradient;
        ctx.fill();
      } else {
        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.fillStyle = '#e8e2d8';
        ctx.fill();

        const gradient = ctx.createRadialGradient(
          cx - radius * 0.32, cy - radius * 0.35, radius * 0.08,
          cx, cy, radius
        );
        gradient.addColorStop(0, '#ffffff');       
        gradient.addColorStop(0.25, '#fbf8f3');    
        gradient.addColorStop(0.75, '#eae3d5');    
        gradient.addColorStop(0.93, '#d1c7b7');    
        gradient.addColorStop(1, '#a89c8a');       

        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.fillStyle = gradient;
        ctx.fill();
      }

      if (!stoneData) return;

      const isLastMove = (currentMoveIndex > 0 && fullMoves[currentMoveIndex - 1].x === x && fullMoves[currentMoveIndex - 1].y === y);
      const showNumbers = toggleMoveNumbers.checked;

      if (showNumbers && stoneData.moveNumber > 0) {
        ctx.font = `bold ${CELL_SIZE * 0.48}px 'Arial'`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = (color === 1) ? (isLastMove ? '#ff4d4d' : '#ffffff') : (isLastMove ? '#cc0000' : '#222222');
        ctx.fillText(stoneData.moveNumber, cx, cy + 1);
      } 
      else if (isLastMove) {
        ctx.beginPath();
        ctx.arc(cx, cy, radius * 0.22, 0, Math.PI * 2);
        ctx.fillStyle = '#ff3333';
        ctx.fill();
      }
    }

    function convertToScene() {
      if (currentMoveIndex === 0) {
        alert('돌이 하나도 올려져 있지 않습니다.');
        return;
      }

      if (confirm('현재 배치를 [기본 장면도]로 변환하시겠습니까?\n\n이전 수순 정보는 삭제되며 1수부터 다시 시작됩니다.')) {
        const state = computeStateAt(currentMoveIndex);

        fullMoves = [];
        window.history.pushState({}, '', window.location.pathname);

        baseBoardState = state.board.map(row => [...row]);
        baseDeadBlack = state.deadBlack;
        baseDeadWhite = state.deadWhite;

        currentMoveIndex = 0;
        updateStatus();
        drawBoard();
        alert('장면도로 변환되었습니다.');
      }
    }

    async function createGifAnimation() {
      if (fullMoves.length === 0) {
        alert('GIF로 만들 수순이 없습니다.');
        return;
      }

      const originalIndex = currentMoveIndex;
      gifBtn.disabled = true;
      gifBtn.innerText = '⏳ 생성중';

      await new Promise(r => setTimeout(r, 50));

      const images = [];
      for (let i = 0; i <= fullMoves.length; i++) {
        currentMoveIndex = i;
        drawBoard();
        images.push(canvas.toDataURL('image/png'));
      }

      const lastFrame = images[images.length - 1];
      for (let k = 0; k < 10; k++) {
        images.push(lastFrame);
      }

      gifshot.createGIF({
        images: images,
        gifWidth: canvas.width,
        gifHeight: canvas.height,
        interval: 1,
        numWorkers: 2
      }, function (obj) {
        if (!obj.error) {
          const downloadLink = document.createElement('a');
          downloadLink.href = obj.image;
          downloadLink.download = `baduk_game_${fullMoves.length}moves.gif`;
          document.body.appendChild(downloadLink);
          downloadLink.click();
          document.body.removeChild(downloadLink);
          alert('GIF 애니메이션이 생성되었습니다.');
        } else {
          alert('GIF 생성 중 오류가 발생했습니다.');
        }

        currentMoveIndex = originalIndex;
        drawBoard();
        gifBtn.disabled = false;
        gifBtn.innerText = '🎬 GIF';
      });
    }

    function handleBoardClick(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;

      let clientX, clientY;
      if (e.touches && e.touches.length > 0) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
      } else if (e.changedTouches && e.changedTouches.length > 0) {
        clientX = e.changedTouches[0].clientX;
        clientY = e.changedTouches[0].clientY;
      } else {
        clientX = e.clientX;
        clientY = e.clientY;
      }

      const clickX = (clientX - rect.left) * scaleX;
      const clickY = (clientY - rect.top) * scaleY;

      const x = Math.round((clickX - PADDING) / CELL_SIZE);
      const y = Math.round((clickY - PADDING) / CELL_SIZE);

      if (x < 0 || x >= BOARD_SIZE || y < 0 || y >= BOARD_SIZE) return;

      const state = computeStateAt(currentMoveIndex);

      if (state.board[x][y] !== 0) return;

      if (currentMoveIndex < fullMoves.length) {
        fullMoves = fullMoves.slice(0, currentMoveIndex);
      }

      const turn = (fullMoves.length % 2 === 0) ? 1 : 2;
      const opponent = turn === 1 ? 2 : 1;

      const nextBoard = state.board.map(row => [...row]);
      nextBoard[x][y] = turn;

      let capturedStones = [];
      const neighbors = getNeighbors(x, y);

      neighbors.forEach(n => {
        if (nextBoard[n.x][n.y] === opponent) {
          const { group, liberties } = getConnectedGroup(nextBoard, n.x, n.y);
          if (liberties === 0) {
            capturedStones = capturedStones.concat(group);
          }
        }
      });

      if (capturedStones.length === 0) {
        const selfInfo = getConnectedGroup(nextBoard, x, y);
        if (selfInfo.liberties === 0) {
          alert('자충수입니다. 이곳에는 둘 수 없습니다.');
          return;
        }
      }

      fullMoves.push({
        x, y,
        color: turn,
        moveNumber: fullMoves.length + 1
      });

      currentMoveIndex = fullMoves.length;
      updateStatus();
      drawBoard();
    }

    canvas.addEventListener('click', handleBoardClick);

    function moveStep(delta) { goToMove(currentMoveIndex + delta); }

    function goToMove(targetIndex) {
      if (targetIndex < 0) targetIndex = 0;
      if (targetIndex > fullMoves.length) targetIndex = fullMoves.length;

      currentMoveIndex = targetIndex;
      updateStatus();
      drawBoard();
    }

    function updateStatus() {
      const nextTurn = (currentMoveIndex % 2 === 0) ? '⚫ 흑' : '⚪ 백';
      turnStatus.innerText = `현재: ${currentMoveIndex}수 / 총 ${fullMoves.length}수 (다음: ${nextTurn})`;
    }

    function copyShareUrl() {
      if (fullMoves.length === 0 && currentMoveIndex === 0) { 
        alert('돌을 놓은 후 주소를 복사해 주세요.'); 
        return; 
      }
      const activeMoves = fullMoves.slice(0, currentMoveIndex);
      const compressedStr = encodeMoves(activeMoves);
      const baseUrl = window.location.origin + window.location.pathname;
      const shareUrl = `${baseUrl}?m=${compressedStr}`;

      navigator.clipboard.writeText(shareUrl).then(() => {
        alert('주소가 복사되었습니다.');
      });
    }

    function captureBoard() {
      const dataURL = canvas.toDataURL('image/png');
      const downloadLink = document.createElement('a');
      downloadLink.download = `baduk_${currentMoveIndex}moves.png`;
      downloadLink.href = dataURL;
      document.body.appendChild(downloadLink);
      downloadLink.click();
      document.body.removeChild(downloadLink);
    }

    function exportSGF() {
      const state = computeStateAt(currentMoveIndex);
      
      let totalStonesOnBoard = 0;
      for (let x = 0; x < BOARD_SIZE; x++) {
        for (let y = 0; y < BOARD_SIZE; y++) {
          if (state.board[x][y] !== 0) totalStonesOnBoard++;
        }
      }

      if (totalStonesOnBoard === 0 && fullMoves.length === 0) { 
        alert('바둑판에 돌이 존재하지 않습니다.'); 
        return; 
      }

      let sgfContent = "(;GM[1]FF[4]CA[UTF-8]AP[WebBaduk]SZ[19]\nPB[Black]PW[White]\n";

      let addBlackCoords = [];
      let addWhiteCoords = [];

      for (let x = 0; x < BOARD_SIZE; x++) {
        for (let y = 0; y < BOARD_SIZE; y++) {
          if (baseBoardState[x][y] === 1) addBlackCoords.push(`[${sgfCoords[x]}${sgfCoords[y]}]`);
          else if (baseBoardState[x][y] === 2) addWhiteCoords.push(`[${sgfCoords[x]}${sgfCoords[y]}]`);
        }
      }

      if (addBlackCoords.length > 0) sgfContent += `AB${addBlackCoords.join('')}\n`;
      if (addWhiteCoords.length > 0) sgfContent += `AW${addWhiteCoords.join('')}\n`;

      fullMoves.forEach(h => {
        sgfContent += `;${h.color === 1 ? "B" : "W"}[${sgfCoords[h.x]}${sgfCoords[h.y]}]`;
      });

      sgfContent += ")";

      const blob = new Blob([sgfContent], { type: "application/x-go-sgf;charset=utf-8" });
      const downloadLink = document.createElement("a");
      downloadLink.download = `baduk_scene_${totalStonesOnBoard}stones.sgf`;
      downloadLink.href = URL.createObjectURL(blob);
      document.body.appendChild(downloadLink);
      downloadLink.click();
      document.body.removeChild(downloadLink);
    }

    function initFromUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      const compressedParam = urlParams.get('m');
      const oldMovesParam = urlParams.get('moves');

      fullMoves = [];

      let rawMoves = [];
      if (compressedParam) {
        rawMoves = decodeMoves(compressedParam);
      } else if (oldMovesParam) {
        const movePairs = oldMovesParam.split(',');
        rawMoves = movePairs.map(p => {
          if (!p) return null;
          const [x, y] = p.split('_').map(Number);
          return { x, y };
        }).filter(Boolean);
      }

      let turn = 1;
      rawMoves.forEach((pt, idx) => {
        if (!isNaN(pt.x) && !isNaN(pt.y) && pt.x >= 0 && pt.x < BOARD_SIZE && pt.y >= 0 && pt.y < BOARD_SIZE) {
          fullMoves.push({
            x: pt.x,
            y: pt.y,
            color: turn,
            moveNumber: idx + 1
          });
          turn = turn === 1 ? 2 : 1;
        }
      });

      currentMoveIndex = fullMoves.length;
    }

    initFromUrl();
    drawBoard();
    updateStatus();
  </script>
</body>
</html>
